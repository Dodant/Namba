# Namba runs on the EC2 that already runs chiral, so this workflow cannot use
# the deploy role that repo uses: that role may run AWS-RunShellScript, which is
# arbitrary shell on a box holding somebody else's production. This one may run
# exactly one SSM document, `namba-deploy`, whose script is in
# .github/deploy/namba-deploy.ssm.yml. That file, not this one, is the ceiling
# on what a compromised workflow here can do to that machine.
name: Deploy

on:
  push:
    branches: [main]
    # Docs-only pushes do not rebuild an image or restart a container.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '*.png'
  workflow_dispatch:

concurrency:
  # A second deploy while one is mid-flight would race the same container.
  group: deploy-namba
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy role's trust policy names this environment. Without it the
    # OIDC subject does not match and the assume-role fails.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # ── the checks from CLAUDE.md, in the order it lists them ──────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Namba-frontend/package-lock.json

      - name: Install front end
        working-directory: Namba-frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: Namba-frontend
        run: |
          npx tsc -b --noEmit
          npx oxlint src

      # Before the image, because the Dockerfile copies dist/ rather than
      # building it: no node in the image, and the built front end is what the
      # API serves.
      - name: Build front end
        working-directory: Namba-frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend suite
        working-directory: Namba-backend
        run: |
          pip install -q -r requirements.txt
          python test_namba.py

      # ── image ─────────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Lower-case and sha-tagged, both because the SSM document's
          # allowedPattern rejects anything else. That pattern is what stops a
          # tag from being a shell injection, so it is deliberately narrow.
          tags: ghcr.io/miiraiii/namba:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── deploy ────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy via the namba-deploy document
        env:
          INSTANCE: i-03752dda7499977e7
          IMAGE: ghcr.io/miiraiii/namba:${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name namba-deploy \
            --parameters "Image=$IMAGE" \
            --query Command.CommandId --output text)"
          echo "command: $CMD_ID"

          for _ in $(seq 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              InProgress|Pending|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text >&2

          # The document rolls the container back itself on a failed check, so a
          # non-Success here means the site is on the previous image, not down.
          [ "$STATUS" = "Success" ] || { echo "deploy failed: $STATUS"; exit 1; }
