# Namba runs on the EC2 that already runs chiral, so this workflow cannot use
# the deploy role that repo uses: that role may run AWS-RunShellScript, which is
# arbitrary shell on a box holding somebody else's production. This one may run
# exactly one SSM document, `namba-deploy`, whose script is in
# .github/deploy/namba-deploy.ssm.yml. That file, not this one, is the ceiling
# on what a compromised workflow here can do to that machine -- and it is the
# *registered* version that runs, not the file, so an edit there is not live
# until somebody registers it. The command is in that file's own header.
name: Deploy

on:
  push:
    branches: [main]
    # Docs-only pushes do not rebuild an image or restart a container.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '*.png'
  # Unfiltered, unlike the push above: a run skipped by paths-ignore reports no
  # check, so a docs-only pull request waits on one that never arrives.
  pull_request:
  workflow_dispatch:

concurrency:
  # Per ref: two deploys still serialise, since main is always the same ref, but
  # a pull request no longer queues behind one.
  group: namba-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two writes belong to the deploy job alone: granting them here hands them
# to every job added below, and a pull request needs neither.
permissions:
  contents: read

jobs:
  # The four checks from CLAUDE.md, as their own job so a pull request runs them
  # and has a named check to report to a protection rule.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 24, not 22: `node --test` runs the front end's .ts files directly, which
      # needs the version where type stripping stopped being a flag.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Namba-frontend/package-lock.json

      - name: Install front end
        working-directory: Namba-frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: Namba-frontend
        run: |
          npx tsc -b --noEmit
          npx oxlint src

      - name: Front end suite
        working-directory: Namba-frontend
        run: npm test

      # Before the backend suite, which reads the built documents and assets,
      # and before the image, which copies dist/ rather than building it: there
      # is no node in the image and the built front end is what the API serves.
      - name: Build front end
        working-directory: Namba-frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Backend suite
        working-directory: Namba-backend
        run: |
          pip install -q -r requirements.txt
          python test_namba.py

      # Handed to the deploy job, so the image cannot carry a front end no
      # suite has seen.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: Namba-frontend/dist
          retention-days: 1

  deploy:
    needs: checks
    # A pull request stops at the checks. Nothing below this line may run
    # against production for code that is not on main yet.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # The deploy role's trust policy names this environment. Without it the
    # OIDC subject does not match and the assume-role fails.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # The front end the checks job built and the suite then read. No node
      # here: the Dockerfile copies dist/, it does not build it.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: Namba-frontend/dist

      # ── image ─────────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner's default builder uses the docker driver, which cannot export
      # a cache -- `cache-to: type=gha` below fails outright without this step.
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Lower-case and sha-tagged, both because the SSM document's
          # allowedPattern rejects anything else. That pattern is what stops a
          # tag from being a shell injection, so it is deliberately narrow.
          tags: ghcr.io/dodant/namba:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── deploy ────────────────────────────────────────────────────────────
      # The role's trust policy accepts two spellings of the OIDC subject,
      # `repo:Dodant/Namba:...` and `repo:Dodant@<user id>/Namba@<repo id>:...`,
      # because GitHub is mid-rollout of the id-suffixed one and which arrives is
      # not ours to pick -- chiral-backend sent the old form and this repo the new
      # one five hours apart. A mismatch reads only as `Not authorized to perform
      # sts:AssumeRoleWithWebIdentity`, which names neither claim; CloudTrail's
      # AssumeRoleWithWebIdentity event carries the subject actually sent.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy via the namba-deploy document
        env:
          INSTANCE: i-03752dda7499977e7
          IMAGE: ghcr.io/dodant/namba:${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name namba-deploy \
            --parameters "Image=$IMAGE" \
            --query Command.CommandId --output text)"
          echo "command: $CMD_ID"

          for _ in $(seq 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              InProgress|Pending|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text >&2

          # The document rolls the container back itself on a failed check, so a
          # non-Success here means the site is on the previous image, not down.
          [ "$STATUS" = "Success" ] || { echo "deploy failed: $STATUS"; exit 1; }
